<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #bulb{
            height: 200px;
            width: 200px;
            border: 2px solid black;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        button{
            height: 30px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="bulb"></div>
    <button onclick="turnRed()">Red</button>
    <button onclick="turnGreen()">Green</button>
    <button onclick="turnBlue()">Blue</button>
    

    <script>
        let bulb = document.querySelector("#bulb")
        let turnRed = () =>{
            bulb.style.backgroundColor = 'red';
        }
        let turnGreen = () =>{
            bulb.style.backgroundColor = 'Green';
        }
        let turnBlue = () =>{
            bulb.style.backgroundColor = 'Blue';
        }

    </script>
</body>
</html>
