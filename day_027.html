
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo">hello</p>



    <script>
        
        let fetchData = async()=>{
            let api = 'https://jsonplaceholder.typicode.com/posts'
            let res = await fetch(api)     // returns promise
            let data = await res.json()
            // let d = JSON.parse(data)
            let demo = document.querySelector('#demo');
            
            data.map( (e)=>{
                demo.innerHTML += 
                ` ${e.id}  ---  ${e.title} ----  ${e.body}  <br> <br>`
            } )


            // .innerHTML = JSON.stringify(d, null, 2)
            console.log(data);
        }
        fetchData()
    </script>
</body>
</html>
