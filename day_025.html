<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #box {
            border: 2px solid black;
            height: 200px;
            width: 200px;
            margin: auto;
        }

        .demo {
            display: flex;
            border: 1px solid gray;
            height: 50%;
        }

        .part {
            width: 50%;
            border: 1px solid gray;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #time {
            border: 1px solid black;
            display: flex;
            justify-content: space-between;
            margin: auto;
            width: 200px;
            font-size: 42px;
        }
    </style>
</head>

<body>

    <div id="time">
        <div id="hr"></div>
        <div>:</div>
        <div id="min"></div>
        <div>:</div>
        <div id="sec"></div>
    </div>

    <div id="box">
        <div id="top" class="demo">
            <div id="date" class="part"></div>
            <div id="day" class="part"></div>
        </div>

        <div id="bottom" class="demo">
            <div id="month" class="part"></div>
            <div id="year" class="part"></div>
        </div>

    </div>


    <script>
        let date = document.querySelector('#date')
        let day = document.querySelector('#day')
        let month = document.querySelector('#month')
        let year = document.querySelector('#year')
        let hr = document.querySelector('#hr')
        let min = document.querySelector('#min')
        let sec = document.querySelector('#sec')

        let days = ['Sunday', 'Monday', 'Tueday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
        let months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']

        let d1 = new Date();
        hr.innerHTML = d1.getHours()
        min.innerHTML = d1.getMinutes()
        sec.innerHTML = d1.getSeconds()
        date.innerHTML = d1.getDate()
        day.innerHTML = days[d1.getDay()]
        month.innerHTML = months[d1.getMonth()]
        year.innerHTML = d1.getFullYear()


        setInterval(() => {
            let now = new Date();
            hr.innerHTML = now.getHours() < 10 ? '0' + now.getHours() : now.getHours()
            min.innerHTML = now.getMinutes() < 10 ? '0'+ now.getMinutes() : now.getMinutes()
            sec.innerHTML = now.getSeconds() < 10 ? '0'+ now.getSeconds() : now.getSeconds()
            date.innerHTML = now.getDate()
            day.innerHTML = days[now.getDay()]
            month.innerHTML = months[now.getMonth()]
            year.innerHTML = now.getFullYear()
        }, 1000)


    </script>
</body>

</html>
