<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #bulb{
            height: 200px;
            width: 200px;
            border: 2px solid black;
            border-radius: 50%;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="bulb"></div>
    <label for="clr" style="font-size: 24px;">Enter colour name</label>
    <input type="text" id="clr">
    <button onclick="change()">Change colour</button>
    

    <script>
        let change = () =>{
            let val = document.querySelector('#clr').value
            document.querySelector('#bulb').style.backgroundColor = val;
        }
    </script>
</body>
</html>
